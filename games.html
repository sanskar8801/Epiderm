<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Files: The Tracking Challenge — Epiderm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0:#FAF3EC;--bg1:#F7EFE7;--bg2:#F4EBE2;--bg3:#F1E7DD;--bg4:#EEE3D9;
  --paper:#FDF8F3;--deep:#351707;--umber:#60341E;--muted:#7C5A48;
  --terra:#A85A2E;--rose:#B04035;--rose2:#8E2E27;--sage:#3D6E58;
  --gold:#D6A057;--line:rgba(122,68,40,.14);
  --shadow:0 24px 70px rgba(58,26,8,.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg0);color:var(--deep);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15;}
#game-root{
  width:100%;max-width:900px;
  padding:2rem 1.5rem 4rem;min-height:100vh;
  position:relative;
}
/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:'Inter',system-ui,sans-serif;font-weight:600;font-size:1rem;
  border:none;cursor:pointer;border-radius:999px;padding:.9rem 2.2rem;
  transition:all .3s ease;position:relative;overflow:hidden;
  letter-spacing:.02em;
}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px;}
.btn-rose{background:var(--rose);color:#fff;}
.btn-rose:hover{background:var(--rose2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(176,64,53,.3);}
.btn-sage{background:var(--sage);color:#fff;}
.btn-sage:hover{background:#2f5a46;transform:translateY(-2px);box-shadow:0 8px 24px rgba(61,110,88,.3);}
.btn-outline{background:transparent;color:var(--umber);border:2px solid var(--line);padding:.8rem 2rem;}
.btn-outline:hover{border-color:var(--terra);color:var(--terra);}
.btn-gold{background:var(--gold);color:var(--deep);}
.btn-gold:hover{background:#c4903e;transform:translateY(-2px);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
/* Link */
.back-link{
  display:inline-flex;align-items:center;gap:.4rem;
  color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:600;
  transition:color .2s;margin-top:1.5rem;
}
.back-link:hover{color:var(--terra);}
/* Progress Bar */
.progress-bar-wrap{
  width:100%;height:6px;background:var(--bg4);border-radius:999px;margin-bottom:2rem;overflow:hidden;
}
.progress-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--terra),var(--gold));border-radius:999px;
  transition:width .6s ease;
}
/* Stage transition */
.stage-enter{animation:stageIn .5s ease forwards;}
.stage-exit{animation:stageOut .3s ease forwards;}
@keyframes stageIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes stageOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-16px);}}
/* XP bar */
.xp-bar{
  position:fixed;top:0;left:0;right:0;height:4px;z-index:1000;
  background:var(--bg4);
}
.xp-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--gold),var(--terra));
  transition:width .5s ease;border-radius:0 2px 2px 0;
}
.xp-badge{
  position:fixed;top:12px;right:16px;z-index:1001;
  background:var(--paper);border:2px solid var(--gold);
  border-radius:999px;padding:.35rem 1rem;font-weight:800;font-size:.85rem;
  color:var(--terra);box-shadow:0 4px 16px rgba(214,160,87,.2);
  transition:transform .3s ease;
}
.xp-badge.pop{animation:xpPop .4s ease;}
@keyframes xpPop{0%{transform:scale(1);}50%{transform:scale(1.2);}100%{transform:scale(1);}}
/* Cards */
.card{
  background:var(--paper);border-radius:16px;border:1px solid var(--line);
  box-shadow:0 4px 20px rgba(58,26,8,.06);
  transition:all .3s ease;overflow:hidden;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
/* Evidence marker */
.evidence-marker{
  display:flex;align-items:center;gap:.8rem;
  padding:1rem 1.2rem;border-radius:12px;cursor:pointer;
  border:2px solid var(--line);background:var(--paper);
  transition:all .3s ease;position:relative;
}
.evidence-marker:hover{border-color:var(--terra);}
.evidence-marker:focus-visible{outline:3px solid var(--rose);outline-offset:3px;}
.evidence-marker.collected{border-color:var(--sage);background:rgba(61,110,88,.06);}
.marker-dot{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;font-weight:800;color:#fff;flex-shrink:0;
  transition:all .3s ease;
}
.marker-dot.pulse{animation:pulse 1.8s ease infinite;}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(168,90,46,.4);}50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(168,90,46,0);}}
.marker-dot.size-dot{background:var(--terra);}
.marker-dot.shape-dot{background:var(--rose);}
.marker-dot.colour-dot{background:var(--gold);}
.marker-dot.border-dot{background:var(--sage);}
.marker-info{display:none;margin-top:.6rem;font-size:.88rem;color:var(--muted);line-height:1.5;padding:.8rem;background:var(--bg1);border-radius:8px;}
.evidence-marker.collected .marker-info{display:block;}
/* Comparison slider */
.slider-container{
  position:relative;width:100%;aspect-ratio:4/3;max-height:450px;
  border-radius:16px;overflow:hidden;cursor:ew-resize;
  background:var(--bg3);border:2px solid var(--line);
  touch-action:none;user-select:none;
}
.slider-img{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.slider-img svg{width:auto;height:60%;}
.slider-before{clip-path:inset(0 50% 0 0);z-index:2;}
.slider-after{z-index:1;}
.slider-handle{
  position:absolute;top:0;bottom:0;width:4px;background:#fff;
  z-index:3;left:50%;transform:translateX(-50%);
  box-shadow:0 0 12px rgba(0,0,0,.15);
}
.slider-handle-grip{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:50%;background:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--muted);
}
.slider-label{
  position:absolute;top:12px;z-index:4;
  background:rgba(53,23,7,.7);color:#fff;
  padding:.3rem .8rem;border-radius:999px;font-size:.75rem;font-weight:700;
  letter-spacing:.05em;pointer-events:none;
}
.slider-label-before{left:12px;}
.slider-label-after{right:12px;}
/* Checkbox group */
.check-group{display:flex;flex-direction:column;gap:.6rem;margin:1.2rem 0;}
.check-item{
  display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem;
  border-radius:10px;border:2px solid var(--line);cursor:pointer;
  transition:all .2s;background:var(--paper);
}
.check-item:hover{border-color:var(--terra);}
.check-item:focus-visible{outline:3px solid var(--rose);outline-offset:3px;}
.check-item.checked{border-color:var(--sage);background:rgba(61,110,88,.06);}
.check-box{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.check-item.checked .check-box{background:var(--sage);border-color:var(--sage);color:#fff;}
.check-item.correct{border-color:var(--sage);background:rgba(61,110,88,.1);}
.check-item.wrong{border-color:var(--rose);background:rgba(176,64,53,.06);}
/* Choice cards */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0;}
.choice-card{
  padding:1.8rem 1.2rem;border-radius:16px;text-align:center;
  border:2px solid var(--line);background:var(--paper);
  cursor:pointer;transition:all .3s ease;font-weight:600;font-size:1rem;
}
.choice-card:hover{border-color:var(--terra);transform:translateY(-2px);}
.choice-card:focus-visible{outline:3px solid var(--rose);outline-offset:3px;}
.choice-card.selected{border-color:var(--terra);background:rgba(168,90,46,.08);}
.choice-card.correct-reveal{border-color:var(--sage);background:rgba(61,110,88,.1);}
.choice-card.wrong-reveal{border-color:var(--rose);background:rgba(176,64,53,.08);}
/* Quiz answer cards */
.quiz-option{
  display:block;width:100%;text-align:left;padding:1rem 1.2rem;
  border-radius:12px;border:2px solid var(--line);background:var(--paper);
  cursor:pointer;transition:all .2s ease;font-size:.95rem;
  font-family:'Inter',system-ui,sans-serif;margin-bottom:.6rem;
}
.quiz-option:hover{border-color:var(--terra);}
.quiz-option:focus-visible{outline:3px solid var(--rose);outline-offset:3px;}
.quiz-option.selected{border-color:var(--terra);background:rgba(168,90,46,.08);}
.quiz-option.correct-ans{border-color:var(--sage);background:rgba(61,110,88,.1);}
.quiz-option.wrong-ans{border-color:var(--rose);background:rgba(176,64,53,.08);}
/* Timeline */
.timeline-track{
  display:flex;align-items:center;justify-content:space-between;
  position:relative;padding:0 1rem;margin:2rem 0;
}
.timeline-track::before{
  content:'';position:absolute;left:2rem;right:2rem;top:50%;height:3px;
  background:var(--bg4);transform:translateY(-50%);z-index:0;
}
.timeline-point{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.5rem;
  cursor:pointer;padding:.5rem;
}
.timeline-point:focus-visible{outline:3px solid var(--rose);outline-offset:3px;}
.timeline-dot{
  width:42px;height:42px;border-radius:50%;
  background:var(--paper);border:3px solid var(--bg4);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.75rem;color:var(--muted);
  transition:all .3s ease;
}
.timeline-point.active .timeline-dot{border-color:var(--terra);color:var(--terra);box-shadow:0 0 0 4px rgba(168,90,46,.15);}
.timeline-label{font-size:.8rem;font-weight:600;color:var(--muted);}
/* Workflow steps */
.workflow-steps{display:flex;flex-direction:column;gap:0;margin:2rem 0;}
.workflow-step{
  display:flex;align-items:center;gap:1rem;padding:1.2rem;
  border-radius:12px;background:var(--paper);border:1px solid var(--line);
  opacity:0;transform:translateY(16px);transition:all .5s ease;
}
.workflow-step.visible{opacity:1;transform:translateY(0);}
.workflow-icon{
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;flex-shrink:0;
}
.workflow-arrow{
  text-align:center;font-size:1.2rem;color:var(--muted);padding:.3rem 0;
  opacity:0;transition:opacity .5s ease;
}
.workflow-arrow.visible{opacity:1;}
/* Results */
.result-badge{
  width:140px;height:140px;border-radius:50%;margin:1.5rem auto;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  border:4px solid;position:relative;
}
.result-badge.bronze{border-color:#cd7f32;background:rgba(205,127,50,.1);color:#cd7f32;}
.result-badge.silver{border-color:#C0C0C0;background:rgba(192,192,192,.1);color:#71706e;}
.result-badge.gold-badge{border-color:var(--gold);background:rgba(214,160,87,.12);color:var(--terra);}
.result-badge.platinum{border-color:#b9bfcf;background:linear-gradient(135deg,rgba(185,191,207,.15),rgba(214,160,87,.1));color:var(--deep);}
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden;}
.confetti-piece{
  position:absolute;width:10px;height:10px;top:-20px;
  animation:confettiFall 3s ease-out forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
/* SVG container */
.lesion-wrap{
  position:relative;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border-radius:16px;overflow:hidden;border:1px solid var(--line);
  padding:2rem;
}
.lesion-wrap .watermark{
  position:absolute;bottom:8px;right:12px;font-size:.65rem;font-weight:800;
  letter-spacing:.08em;color:rgba(122,68,40,.18);text-transform:uppercase;
}
/* Scan line animation for landing */
.scan-line{
  position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--terra),transparent);
  opacity:.3;animation:scanMove 3s ease-in-out infinite;
  pointer-events:none;
}
@keyframes scanMove{0%{top:10%;}50%{top:90%;}100%{top:10%;}}
/* Misc */
.disclaimer{font-size:.78rem;color:var(--muted);text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--line);line-height:1.5;}
.section-label{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-bottom:.5rem;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
.flash{animation:flashAnim .6s ease;}
@keyframes flashAnim{0%{box-shadow:0 0 0 0 rgba(61,110,88,.4);}50%{box-shadow:0 0 0 12px rgba(61,110,88,0);}100%{box-shadow:0 0 0 0 rgba(61,110,88,0);}}
.learning-box{
  background:linear-gradient(135deg,rgba(214,160,87,.1),rgba(168,90,46,.06));
  border-left:4px solid var(--gold);border-radius:0 12px 12px 0;
  padding:1.2rem 1.5rem;margin:1.5rem 0;
}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.5rem 0;}
.stat-card{text-align:center;padding:1.2rem;background:var(--bg1);border-radius:12px;}
.stat-card .stat-val{font-size:1.8rem;font-weight:800;color:var(--terra);}
.stat-card .stat-label{font-size:.8rem;color:var(--muted);margin-top:.3rem;}
/* Case cards grid */
.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin:1.5rem 0;}
/* Evidence grid */
.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1.5rem 0;}
/* Responsive */
@media(max-width:768px){
  .case-grid{grid-template-columns:1fr 1fr;}
  .choice-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .evidence-grid{grid-template-columns:1fr;}
  #game-root{padding:1.5rem 1rem 3rem;}
}
@media(max-width:640px){
  .case-grid{grid-template-columns:1fr;}
  .btn{width:100%;padding:1rem 1.5rem;min-height:48px;}
  .stats-grid{grid-template-columns:1fr;}
  .quiz-option{padding:1rem;min-height:48px;}
  .slider-container{aspect-ratio:1/1;}
}
/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .scan-line{display:none;}
}
</style>
</head>
<body>
<div class="xp-bar" id="xpBar"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
<div class="xp-badge" id="xpBadge" style="display:none;">0 XP</div>
<div id="game-root"></div>
<script>
// ==========================================
// EPIDERM: CASE FILES — THE TRACKING CHALLENGE
// Complete State Machine & Game Engine
// ==========================================

const gameState = {
  stage: 'LANDING', // LANDING, CASE_SELECT, BASELINE, COMPARISON, TWIST, TIMELINE, REVEAL, QUIZ, RESULTS
  selectedCase: 1,  // 1: Familiar, 2: Changing, 3: Mystery
  xp: 0,
  cluesCollected: 0,
  evidenceMarkers: { size: false, shape: false, colour: false, border: false },
  comparisonSelections: { size: false, shape: false, colour: false, border: false },
  comparisonSubmitted: false,
  twistChoice: null, // 'lesion' | 'photo'
  twistSubmitted: false,
  timelineStep: 0, // 0: M0, 1: M3, 2: M6
  timelineComparison: [0, 1], // [M0, M3]
  quizCurrent: 0,
  quizAnswers: [null, null, null, null, null],
  quizScore: 0,
  casesInvestigated: 1
};

const CASE_DATA = {
  1: {
    id: 'CASE 001',
    title: 'THE FAMILIAR CASE',
    subtitle: 'Uniform & Symmetrical',
    tag: 'Baseline Check',
    desc: 'A common-appearing circular mole with even pigmentation. Can careful tracking spot subtle evolution that casual observation misses?',
    diffs: { size: true, shape: false, colour: false, border: false },
    diffExplanation: 'In Case 001, the primary physical evolution across 3 months was a 10% increase in diameter (Size). Symmetrical shape, uniform tone, and smooth border remained stable.',
    twistNote: 'The high-angle glare in the follow-up made the lesion look 20% smaller with washed-out pigment. True measurement revealed it had actually grown slightly.'
  },
  2: {
    id: 'CASE 002',
    title: 'THE CHANGING CASE',
    subtitle: 'Multi-Toned & Dynamic',
    tag: 'Active Monitoring',
    desc: 'An oval lesion exhibiting multiple shades of tan and brown. Discover how two distinct visual characteristics evolve simultaneously over time.',
    diffs: { size: true, shape: false, colour: true, border: false },
    diffExplanation: 'In Case 002, both Size (+12%) and Colour shifted: a new darker focal area developed near the upper-left pole alongside overall pigment darkening.',
    twistNote: 'Warm ambient lighting and low shutter speed exaggerated the redness, creating false contrast. Standardized illumination showed the actual localized pigment shift.'
  },
  3: {
    id: 'CASE 003',
    title: 'THE MYSTERY CASE',
    subtitle: 'Contoured & Asymmetrical',
    tag: 'Structural Inspection',
    desc: 'A lesion with gentle scalloped borders. Test your detective eye at distinguishing real contour changes from photographic tilt distortion.',
    diffs: { size: true, shape: false, colour: false, border: true },
    diffExplanation: 'In Case 003, both Size (+8%) and Border changed: the lateral edge developed a sharper, notched indentation by Month 3.',
    twistNote: 'Lens distortion from holding the camera too close curved the edges artificially. Consistent focal distance is vital for verifying border changes.'
  }
};

const QUIZ_QUESTIONS = [
  {
    q: "You are beginning to track a mole. Which photograph should be your starting point?",
    options: [
      "A clear, well-lit close-up photograph taken in consistent conditions",
      "Any casual photo from your camera roll",
      "A photograph taken in direct sunlight",
      "A distant full-body photograph"
    ],
    correct: 0,
    explanation: "A high-quality baseline must be captured with clear focus, perpendicular angle, and neutral illumination so future scans can be accurately compared."
  },
  {
    q: "Three months later, the lesion appears slightly larger. What should you do?",
    options: [
      "Ignore it — lesions always change",
      "Take a new photograph under the same conditions and compare carefully",
      "Immediately assume it is dangerous",
      "Delete the original photograph"
    ],
    correct: 1,
    explanation: "Capturing a standardized follow-up image allows reliable comparison against baseline. If measurable change persists, share the records with a dermatologist."
  },
  {
    q: "Which features should you observe when comparing two images?",
    options: [
      "Only colour",
      "Only size",
      "Size, shape, colour and border characteristics",
      "Only whether it looks 'different'"
    ],
    correct: 2,
    explanation: "Clinical tracking follows the dermatological ABCDE framework: observing Asymmetry, Border irregularity, Colour variegation, Diameter (size), and Evolution."
  },
  {
    q: "The second photograph has different lighting and camera distance. What is the main concern?",
    options: [
      "The lesion has definitely changed",
      "Inconsistent conditions can make it difficult to determine whether apparent differences are real",
      "Lighting does not matter at all",
      "The photograph is useless"
    ],
    correct: 1,
    explanation: "Inconsistent zoom, lighting angle, and focal length can artificially shrink, stretch, wash out, or distort visual lesion characteristics."
  },
  {
    q: "What is the most responsible next step if a tracked lesion appears to be changing?",
    options: [
      "Search online for possible diagnoses",
      "Wait another six months before doing anything",
      "Consult a qualified dermatologist or healthcare professional",
      "Use AI analysis as a final diagnosis"
    ],
    correct: 2,
    explanation: "AI and mobile tracking are monitoring aids, not diagnostic tools. Any documented morphological evolution should be reviewed by a clinical dermatologist."
  }
];

// Helper: Add XP with badge pop
function addXP(amount) {
  gameState.xp += amount;
  const xpBadge = document.getElementById('xpBadge');
  const xpBarFill = document.getElementById('xpBarFill');
  if (xpBadge) {
    xpBadge.style.display = 'block';
    xpBadge.textContent = `${gameState.xp} XP`;
    xpBadge.classList.remove('pop');
    void xpBadge.offsetWidth;
    xpBadge.classList.add('pop');
  }
  if (xpBarFill) {
    const maxXP = 650;
    const pct = Math.min(100, Math.round((gameState.xp / maxXP) * 100));
    xpBarFill.style.width = `${pct}%`;
  }
}

// Lesion SVG Generator (Simulated Dermoscopic Visuals)
function getLesionSvg(caseNum, timepoint, size = 260) {
  // timepoint: 'm0' (baseline), 'm3' (3 months), 'm3_bad' (inconsistent photo), 'm6' (6 months)
  const isBad = timepoint === 'm3_bad';
  const filterId = `filter-${caseNum}-${timepoint}`;
  
  let skinBg = '#F3DEC9';
  let skinPattern = '#EBCFBA';
  let lightingOverlay = '';

  if (isBad) {
    if (caseNum === 1) {
      // Overexposed / harsh bright light
      skinBg = '#FDF0E2';
      lightingOverlay = '<rect width="100%" height="100%" fill="rgba(255,255,255,0.32)" pointer-events="none" /><circle cx="210" cy="60" r="120" fill="url(#glareGrad)" opacity="0.6"/>';
    } else if (caseNum === 2) {
      // Yellowish warm indoor incandescent tint
      skinBg = '#EBD0A7';
      lightingOverlay = '<rect width="100%" height="100%" fill="rgba(235,160,50,0.18)" pointer-events="none" mix-blend-mode="multiply"/>';
    } else {
      // Underexposed, far distance, blurry
      skinBg = '#DECAA8';
      lightingOverlay = '<rect width="100%" height="100%" fill="rgba(40,20,10,0.22)" pointer-events="none" />';
    }
  }

  let lesionGraphics = '';

  if (caseNum === 1) {
    // CASE 1: Circular mole, expands in M3 and M6
    let r = 44;
    let colorCenter = '#7E5224';
    let colorEdge = '#A26D38';

    if (timepoint === 'm3') {
      r = 50; // +13% growth
    } else if (timepoint === 'm3_bad') {
      r = 38; // Distance illusion: appears smaller
      colorCenter = '#986B3E';
      colorEdge = '#B48858';
    } else if (timepoint === 'm6') {
      r = 54; // +22% growth, slight central darkening
      colorCenter = '#623B14';
      colorEdge = '#9C6833';
    }

    lesionGraphics = `
      <defs>
        <radialGradient id="c1Grad-${timepoint}" cx="45%" cy="45%" r="55%">
          <stop offset="0%" stop-color="${colorCenter}"/>
          <stop offset="70%" stop-color="${colorEdge}"/>
          <stop offset="95%" stop-color="${colorEdge}" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="${colorEdge}" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glareGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="130" cy="130" r="${r}" fill="url(#c1Grad-${timepoint})" filter="${isBad && caseNum === 3 ? 'url(#blurFilter)' : 'none'}"/>

      <circle cx="122" cy="125" r="2.5" fill="#4B2C0D" opacity="0.6"/>
      <circle cx="138" cy="120" r="2" fill="#4B2C0D" opacity="0.5"/>
      <circle cx="132" cy="140" r="2.2" fill="#4B2C0D" opacity="0.5"/>
      <circle cx="118" cy="136" r="1.8" fill="#4B2C0D" opacity="0.4"/>
      <circle cx="142" cy="134" r="2.2" fill="#4B2C0D" opacity="0.5"/>
    `;
  } else if (caseNum === 2) {
    // CASE 2: Multi-toned oval, dark spot develops at M3
    let rx = 52, ry = 42, rot = -18;
    let centerCol = '#5A3618', midCol = '#8F5B2F', edgeCol = '#B98555';
    let extraSpot = '';

    if (timepoint === 'm3') {
      rx = 58; ry = 47;
      centerCol = '#42240E'; // Darkened
      extraSpot = `
        <!-- Evolved darker focal pigment cluster at upper pole -->
        <ellipse cx="118" cy="112" rx="14" ry="10" fill="#2C1405" opacity="0.75" transform="rotate(-15 118 112)"/>
        <circle cx="114" cy="110" r="3" fill="#1C0A02"/>
        <circle cx="122" cy="114" r="2.5" fill="#1C0A02"/>
      `;
    } else if (timepoint === 'm3_bad') {
      rx = 48; ry = 38;
      // Glare washed out the new focal spot
      centerCol = '#7A4D27';
    } else if (timepoint === 'm6') {
      rx = 64; ry = 51;
      centerCol = '#32190A';
      extraSpot = `
        <ellipse cx="116" cy="110" rx="18" ry="14" fill="#1E0B02" opacity="0.85" transform="rotate(-15 116 110)"/>
        <circle cx="112" cy="108" r="4" fill="#0F0501"/>
        <circle cx="120" cy="113" r="3.5" fill="#0F0501"/>
        <circle cx="124" cy="106" r="2.5" fill="#0F0501"/>
      `;
    }

    lesionGraphics = `
      <defs>
        <radialGradient id="c2Grad-${timepoint}" cx="42%" cy="46%" r="58%">
          <stop offset="0%" stop-color="${centerCol}"/>
          <stop offset="45%" stop-color="${midCol}"/>
          <stop offset="85%" stop-color="${edgeCol}"/>
          <stop offset="100%" stop-color="${edgeCol}" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g transform="rotate(${rot} 130 130)">
        <ellipse cx="130" cy="130" rx="${rx}" ry="${ry}" fill="url(#c2Grad-${timepoint})"/>
        <!-- Natural pigment network variegation -->
        <ellipse cx="122" cy="126" rx="${rx * 0.5}" ry="${ry * 0.45}" fill="#3C1F0A" opacity="0.45"/>
        <circle cx="140" cy="122" r="3" fill="#2A1305" opacity="0.6"/>
        <circle cx="148" cy="134" r="2.5" fill="#2A1305" opacity="0.5"/>
        <circle cx="112" cy="138" r="2.2" fill="#2A1305" opacity="0.5"/>
        ${extraSpot}
      </g>
    `;
  } else {
    // CASE 3: Irregular scalloped border, notch deepens in M3 and M6
    let scale = 1;
    let pathD = "M 130 78 C 160 74 182 95 184 122 C 186 148 165 174 138 180 C 114 186 86 170 82 144 C 79 120 98 82 130 78 Z";
    let notch = '';

    if (timepoint === 'm3') {
      scale = 1.08;
      // Notch on upper-left border indents inwards
      pathD = "M 130 76 C 164 72 188 94 190 124 C 192 152 168 180 138 186 C 110 192 84 174 80 144 C 76 128 92 116 88 102 C 84 88 104 80 130 76 Z";
      notch = `
        <!-- Border notch accent -->
        <path d="M 88 102 C 82 112 84 122 80 132" stroke="#321A0A" stroke-width="2.5" fill="none" opacity="0.8"/>
      `;
    } else if (timepoint === 'm3_bad') {
      scale = 0.88;
      // Low resolution blur hides the border notch
    } else if (timepoint === 'm6') {
      scale = 1.15;
      pathD = "M 130 74 C 168 70 194 92 196 126 C 198 156 172 186 138 192 C 106 198 80 178 76 144 C 72 126 90 114 84 98 C 80 84 102 78 130 74 Z";
      notch = `
        <path d="M 84 98 C 76 112 80 126 76 138" stroke="#220F04" stroke-width="3" fill="none" opacity="0.9"/>
      `;
    }

    lesionGraphics = `
      <defs>
        <radialGradient id="c3Grad-${timepoint}" cx="46%" cy="46%" r="54%">
          <stop offset="0%" stop-color="#482E18"/>
          <stop offset="65%" stop-color="#724B28"/>
          <stop offset="92%" stop-color="#9C6B3D"/>
          <stop offset="100%" stop-color="#9C6B3D" stop-opacity="0"/>
        </radialGradient>
        <filter id="blurFilter"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>
      <g transform="translate(${130 - 130*scale} ${130 - 130*scale}) scale(${scale})" filter="${isBad && caseNum === 3 ? 'url(#blurFilter)' : 'none'}">
        <path d="${pathD}" fill="url(#c3Grad-${timepoint})"/>
        ${notch}
        <circle cx="120" cy="120" r="3" fill="#2B1607" opacity="0.6"/>
        <circle cx="145" cy="115" r="2.8" fill="#2B1607" opacity="0.5"/>
        <circle cx="152" cy="140" r="2.4" fill="#2B1607" opacity="0.5"/>
        <circle cx="128" cy="155" r="2" fill="#2B1607" opacity="0.5"/>
      </g>
    `;
  }

  return `
    <svg viewBox="0 0 260 260" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" style="display:block;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 20px rgba(53,23,7,0.12);background:${skinBg};">
      <!-- Simulated skin background texture -->
      <rect width="100%" height="100%" fill="${skinBg}"/>
      <circle cx="40" cy="40" r="80" fill="${skinPattern}" opacity="0.25"/>
      <circle cx="220" cy="200" r="90" fill="${skinPattern}" opacity="0.2"/>

      <circle cx="130" cy="130" r="118" fill="none" stroke="rgba(122,68,40,0.18)" stroke-width="1.5" stroke-dasharray="4 6"/>

      <line x1="20" y1="130" x2="26" y2="130" stroke="rgba(122,68,40,0.3)" stroke-width="1.5"/>
      <line x1="234" y1="130" x2="240" y2="130" stroke="rgba(122,68,40,0.3)" stroke-width="1.5"/>

      <line x1="130" y1="234" x2="130" y2="240" stroke="rgba(122,68,40,0.3)" stroke-width="1.5"/>
      ${lesionGraphics}
      ${lightingOverlay}
    </svg>
  `;
}

// Progress Bar Helper
function renderProgressBar(currentStep, totalSteps) {
  const pct = Math.round((currentStep / totalSteps) * 100);
  return `
    <div class="progress-bar-wrap" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar-fill" style="width:${pct}%"></div>
    </div>
  `;
}

// State Switcher
function setStage(newStage) {
  const root = document.getElementById('game-root');
  if (!root) return;
  root.classList.remove('stage-enter');
  root.classList.add('stage-exit');
  setTimeout(() => {
    gameState.stage = newStage;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderCurrentStage();
    root.classList.remove('stage-exit');
    root.classList.add('stage-enter');
  }, 220);
}

// Router
function renderCurrentStage() {
  const root = document.getElementById('game-root');
  if (!root) return;
  switch (gameState.stage) {
    case 'LANDING':
      renderLanding(root);
      break;
    case 'CASE_SELECT':
      renderCaseSelect(root);
      break;
    case 'BASELINE':
      renderBaseline(root);
      break;
    case 'COMPARISON':
      renderComparison(root);
      break;
    case 'TWIST':
      renderTwist(root);
      break;
    case 'TIMELINE':
      renderTimeline(root);
      break;
    case 'REVEAL':
      renderReveal(root);
      break;
    case 'QUIZ':
      renderQuiz(root);
      break;
    case 'RESULTS':
      renderResults(root);
      break;
    default:
      renderLanding(root);
  }
}

function initSlider() {
  const container = document.getElementById('compSlider');
  const beforeLayer = document.getElementById('sliderBefore');
  const handle = document.getElementById('sliderHandle');
  if (!container || !beforeLayer || !handle) return;

  let isDragging = false;

  function updateSlider(clientX) {
    const rect = container.getBoundingClientRect();
    let x = clientX - rect.left;
    let pct = (x / rect.width) * 100;
    pct = Math.max(10, Math.min(90, pct));
    beforeLayer.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
    handle.style.left = `${pct}%`;
    handle.setAttribute('aria-valuenow', Math.round(pct));
  }

  handle.addEventListener('mousedown', () => isDragging = true);
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    updateSlider(e.clientX);
  });

  // Touch support
  handle.addEventListener('touchstart', (e) => isDragging = true, { passive: true });
  window.addEventListener('touchend', () => isDragging = false);
  window.addEventListener('touchmove', (e) => {
    if (!isDragging || !e.touches[0]) return;
    updateSlider(e.touches[0].clientX);
  }, { passive: true });

  // Keyboard accessibility
  handle.addEventListener('keydown', (e) => {
    let currentPct = parseFloat(handle.style.left) || 50;
    if (e.key === 'ArrowLeft') {
      currentPct = Math.max(10, currentPct - 5);
      beforeLayer.style.clipPath = `inset(0 ${100 - currentPct}% 0 0)`;
      handle.style.left = `${currentPct}%`;
    } else if (e.key === 'ArrowRight') {
      currentPct = Math.min(90, currentPct + 5);
      beforeLayer.style.clipPath = `inset(0 ${100 - currentPct}% 0 0)`;
      handle.style.left = `${currentPct}%`;
    }
  });
}

// Restart Function
window.restartGame = function() {
  gameState.stage = 'CASE_SELECT';
  gameState.xp = 0;
  gameState.cluesCollected = 0;
  gameState.evidenceMarkers = { size: false, shape: false, colour: false, border: false };
  gameState.comparisonSelections = { size: false, shape: false, colour: false, border: false };
  gameState.comparisonSubmitted = false;
  gameState.twistChoice = null;
  gameState.twistSubmitted = false;
  gameState.timelineStep = 0;
  gameState.quizCurrent = 0;
  gameState.quizAnswers = [null, null, null, null, null];
  gameState.quizScore = 0;
  addXP(25);
  setStage('CASE_SELECT');
};

// Simple CSS Confetti Particles
function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  if (!container) return;
  const colors = ['#B04035', '#A85A2E', '#3D6E58', '#D6A057', '#60341E'];
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = `${Math.random() * 100}%`;
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = `${Math.random() * 1.5}s`;
    el.style.animationDuration = `${2 + Math.random() * 2}s`;
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    container.appendChild(el);
  }
}

// Initial Boot
document.addEventListener('DOMContentLoaded', () => {
  renderCurrentStage();
});
</script>
