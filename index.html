<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epiderm — Coming Soon</title>

    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* SKIN-INSPIRED GRADIENT */
            background: linear-gradient(
                135deg,
                #fdf7ed 0%,    /* cream */
                #f4e3c2 25%,   /* beige */
                #f8d2b6 55%,   /* peach */
                #eac3a3 100%   /* warm sand */
            );
            background-size: 300% 300%;
            animation: skinShift 14s ease-in-out infinite;
        }

        @keyframes skinShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(24px);
            padding: 42px;
            border-radius: 26px;
            max-width: 420px;
            width: 88%;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);

            animation: fadeIn 1.4s ease, floatUp 4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
            100% { transform: translateY(0); }
        }

        h1 {
            margin: 0 0 15px;
            font-size: 36px;
            font-weight: 700;
            color: #2b2b2b;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* Seamless Early Access Signup Form */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeButton 2.2s ease forwards;
            animation-delay: 1.8s;
        }

        .signup-input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-family: inherit;
            color: #222;
            outline: none;
            text-align: center;
            transition: 0.25s;
        }

        .signup-input:focus {
            border-color: #eac3a3;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(230, 164, 120, 0.25);
        }

        .signup-input::placeholder {
            color: #888;
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13.5px;
            color: #555;
            cursor: pointer;
            user-select: none;
            margin: 2px 0;
        }

        .checkbox-container input[type="checkbox"] {
            accent-color: #eac3a3;
            cursor: pointer;
        }

        /* Coming Soon button */
        .btn {
            padding: 14px 28px;
            background: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 17px;
            color: #222;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;

            box-shadow: 0 6px 20px rgba(230,164,120,0.28);
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(230,150,110,0.35);
        }

        .btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
        }

        .feedback-msg {
            font-size: 13.5px;
            line-height: 1.5;
            padding: 10px 14px;
            border-radius: 12px;
            margin-top: 4px;
            color: #14532d;
            background: rgba(220, 252, 231, 0.85);
            display: none;
        }

        @keyframes fadeButton {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .email {
            margin-top: 18px;
            margin-bottom: 0;
            font-size: 15px;
            color: #555;
        }

        .email a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }

        .socials {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 14px;
        }

        .socials a {
            color: #555;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .socials a:hover {
            color: #111;
        }

        .socials svg {
            flex-shrink: 0;
        }

        footer {
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Epiderm</h1>

        <p>
            Skin cancer is curable when detected early. Epiderm brings clinical grade AI to your phone to detect lesions, identify patterns and predict stage in seconds with precision in every pixel.
        </p>

        <!-- Hidden iframe for silent background submission to Google Forms -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted){onGoogleFormSuccess();}"></iframe>

        <!-- Seamless In-Page Early Access Form -->
        <form 
            id="signup-form" 
            class="signup-form" 
            action="https://docs.google.com/forms/d/e/1FAIpQLSd3JMyDt54NtRfsKS1IyUo439t9kuuF3JksbpyTovfKX0ectQ/formResponse" 
            method="POST" 
            target="hidden_iframe"
        >
            <!-- Name Field (Optional) -->
            <input 
                type="text" 
                id="name-input" 
                name="entry.1329513645" 
                class="signup-input" 
                placeholder="Your Name (Optional)" 
                autocomplete="name"
            />

            <!-- Email Field (Required) -->
            <input 
                type="email" 
                id="email-input" 
                name="entry.220489884" 
                class="signup-input" 
                placeholder="Enter your email address..." 
                required 
                autocomplete="email"
            />

            <!-- Medical Professional Checkbox -->
            <label class="checkbox-container">
                <input type="checkbox" id="medical-checkbox">
                <span>I am a medical professional</span>
            </label>
            <input type="hidden" name="entry.1915915379" id="medical-input" value="No">

            <button type="submit" id="submit-btn" class="btn">
                <span>Join Early Access</span>
            </button>

            <div id="form-feedback" class="feedback-msg"></div>
        </form>

        <p class="email">
            Contact:
            <a href="mailto:epiderm.org@gmail.com">epiderm.org@gmail.com</a>
        </p>

        <div class="socials">
            <a 
                href="https://www.linkedin.com/in/epiderm-org-459613418" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Epiderm on LinkedIn"
            >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.2V10.9H6.46M7.83 6.64a1.64 1.64 0 1 0 0 3.28 1.64 1.64 0 0 0 0-3.28Z"/>
                </svg>
                <span>LinkedIn</span>
            </a>

            <a 
                href="https://www.instagram.com/epidermdotorg/" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Epiderm on Instagram"
            >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069M12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
                </svg>
                <span>Instagram</span>
            </a>
        </div>

        <footer>© 2025 Epiderm Health AI</footer>
    </div>

    <script>
        // Google Forms Configuration
        const medicalCheckbox = document.getElementById('medical-checkbox');
        const medicalInput = document.getElementById('medical-input');
        const submitBtn = document.getElementById('submit-btn');
        const nameInput = document.getElementById('name-input');
        const emailInput = document.getElementById('email-input');
        const feedback = document.getElementById('form-feedback');
        let submitted = false;

        medicalCheckbox.addEventListener('change', function() {
            medicalInput.value = this.checked ? "Yes" : "No";
        });

        document.getElementById('signup-form').addEventListener('submit', function() {
            submitted = true;
            submitBtn.disabled = true;
            submitBtn.innerHTML = "<span>Joining...</span>";
        });

        function onGoogleFormSuccess() {
            submitBtn.innerHTML = "<span>✓ Joined Early Access</span>";
            submitBtn.disabled = true;
            nameInput.disabled = true;
            emailInput.disabled = true;
            medicalCheckbox.disabled = true;
            feedback.innerHTML = "✓ You're on the list! We'll notify you as soon as we launch.";
            feedback.style.display = "block";
        }
    </script>
</body>
</html>
