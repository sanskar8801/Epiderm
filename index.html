<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epiderm – App Coming Soon</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                         Ubuntu, Cantarell, "Open Sans", sans-serif;
            background: linear-gradient(145deg, #eef1ff, #fce9f3, #e7f3ff);
            background-size: 400% 400%;
            animation: floatBg 18s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        @keyframes floatBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(18px);
            border-radius: 26px;
            padding: 48px 40px;
            width: 88%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            color: #1f1f1f;
        }

        p {
            margin-top: 16px;
            font-size: 1rem;
            line-height: 1.6;
            color: #5b5b5b;
        }

        .cta {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 34px;
            background: #ffffff;
            color: #111;
            border-radius: 45px;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid #ddd;
            transition: 0.3s;
            box-shadow: 0 6px 18px rgba(0,0,0,0.07);
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(0,0,0,0.12);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Epiderm</h1>

        <p>
            AI-powered skin cancer detection designed for early, accurate,
            and accessible diagnosis. Precision in every pixel.
        </p>

        <div class="cta">
            <a href="#" class="button">App Coming Soon</a>
        </div>

        <footer>© 2025 Epiderm Health AI</footer>
    </div>
</body>
</html>
